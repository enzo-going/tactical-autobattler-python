[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["battle_simulator", "battle_simulator.*"]
namespaces = false

[project]
name = "tactical-autobattler-python"
version = "0.7.0"
description = "A turn-based tactical game and auto-battler simulation lab built with Python and object-oriented design."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Enzo Liutkus Going" }
]
keywords = [
    "python",
    "oop",
    "simulation",
    "auto-battler",
    "strategy-game",
]

[project.scripts]
tactical-autobattler = "battle_simulator.cli:main"
battle-simulator = "battle_simulator.cli:main"

[project.urls]
Repository = "https://github.com/enzo-going/tactical-autobattler-python"
Playground = "https://enzo-going.github.io/tactical-autobattler-python/"
