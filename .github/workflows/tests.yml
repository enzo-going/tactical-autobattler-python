name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package
        run: python -m pip install .

      - name: Check installed commands outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          tactical-autobattler --list-strategies
          battle-simulator --mode auto --rounds 2 --seed 11 --quiet

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Compile Python modules
        run: python -m compileall battle_simulator tests web/playground.py tools

      - name: Check JavaScript syntax
        run: |
          node --check web/game.js
          node --check web/app.js

      - name: Assemble both web entry points
        run: python tools/build_site.py
