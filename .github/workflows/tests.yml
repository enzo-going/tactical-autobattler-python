name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Compile Python modules
        run: python -m compileall battle_simulator tests web/playground.py tools

      - name: Check JavaScript syntax
        run: |
          node --check web/game.js
          node --check web/app.js

      - name: Assemble both web entry points
        run: python tools/build_site.py
